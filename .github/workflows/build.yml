name: build-plugin

on:
  push:
  workflow_dispatch: # lets you start it by hand from the Actions tab

jobs:
  build:
    # Pinned: ubuntu-latest moves to 26.04 from Oct 2026. Change on purpose when you want the new image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webview/package-lock.json
      - name: Build chat panel (webview)
        working-directory: webview
        run: |
          npm ci
          npm run typecheck
          npm run build
      - uses: gradle/actions/setup-gradle@v5
      - name: Test and build plugin zip
        run: |
          chmod +x gradlew
          ./gradlew test buildPlugin
      - uses: actions/upload-artifact@v6
        with:
          name: plugin-zip
          path: build/distributions/*.zip
      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-report
          path: build/reports/tests/

  # Checks the plugin against real RustRover builds. Informational for now: it never blocks the artifact.
  verify:
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webview/package-lock.json
      - name: Build chat panel (webview)
        working-directory: webview
        run: |
          npm ci
          npm run build
      - uses: gradle/actions/setup-gradle@v5
      - name: Plugin verifier
        run: |
          chmod +x gradlew
          ./gradlew verifyPlugin